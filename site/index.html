<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>NAV · Mappa da campo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b1220'/%3E%3Cpath d='M50 20a20 20 0 0 0-20 20c0 15 20 40 20 40s20-25 20-40a20 20 0 0 0-20-20z' fill='%2338e0a6'/%3E%3Ccircle cx='50' cy='40' r='7' fill='%230b1220'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Mirino centrale -->
  <div id="crosshair" aria-hidden="true">
    <svg viewBox="0 0 40 40" width="40" height="40">
      <circle cx="20" cy="20" r="7" fill="none" stroke="#fff" stroke-width="1.5"/>
      <line x1="20" y1="0"  x2="20" y2="12" stroke="#fff" stroke-width="1.5"/>
      <line x1="20" y1="28" x2="20" y2="40" stroke="#fff" stroke-width="1.5"/>
      <line x1="0"  y1="20" x2="12" y2="20" stroke="#fff" stroke-width="1.5"/>
      <line x1="28" y1="20" x2="40" y2="20" stroke="#fff" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="1.5" fill="#38e0a6"/>
    </svg>
  </div>

  <!-- Barra coordinate superiore -->
  <header id="topbar">
    <div id="coordCenter" class="coord-block" role="button" tabindex="0" title="Tocca per cambiare formato coordinate">
      <span class="coord-label">CENTRO</span>
      <span id="coordCenterVal" class="coord-val">—</span>
    </div>
    <div id="gpsChip" class="gps-chip off" role="status">
      <span class="gps-dot"></span>
      <span id="gpsChipText">GPS off</span>
    </div>
  </header>

  <!-- Bottoni flottanti -->
  <div id="fab-stack">
    <button id="btnLocate"  class="fab" title="Posizione GPS" aria-label="Posizione GPS">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <button id="btnLayers" class="fab primary" title="Livelli" aria-label="Livelli">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 8.5 12 15 2 8.5 12 2"/><polyline points="2 15.5 12 22 22 15.5"/></svg>
    </button>
  </div>

  <!-- Pannello livelli -->
  <aside id="panel" class="hidden" aria-hidden="true">
    <div class="panel-head">
      <h1>Livelli</h1>
      <button id="btnClosePanel" class="icon-btn" aria-label="Chiudi">✕</button>
    </div>
    <p class="panel-hint">Trascina <span class="grip-mini">⋮⋮</span> o usa ▲▼ per l'ordine. In alto = sopra.</p>
    <ul id="layerList"></ul>
    <div class="panel-foot">
      <button id="btnFit" class="ghost-btn">Inquadra le mie foto</button>
      <button id="btnReset" class="ghost-btn">Reset</button>
    </div>
  </aside>

  <div id="toast" class="hidden"></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/proj4.js"></script>
  <script src="overlays.js"></script>
  <script src="app.js"></script>
</body>
</html>
